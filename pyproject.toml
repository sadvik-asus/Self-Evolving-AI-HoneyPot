[tool.black]
line-length = 88
target-version = ['py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | \.venv
  | venv
  | env
  | __pycache__
)/
'''

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "invalid-name",
    "too-many-arguments",
    "too-many-locals",
    "too-few-public-methods"
]

[tool.pylint.format]
max-line-length = 88
